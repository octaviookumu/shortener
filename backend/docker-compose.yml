services:
  postgres:
    image: postgres:18
    container_name: shortener
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - shortener

  adminer:
    image: adminer
    ports:
      - "8081:8080"
    networks:
      - shortener

volumes:
  postgres_data:

networks:
  shortener:
    name: shortener